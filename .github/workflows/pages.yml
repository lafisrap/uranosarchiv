name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 and pdfjs-dist both require Node >=22 — a lower version
          # here causes npm to behave inconsistently with the lock file
          # (confirmed by a failed CI run during the Phase 1 pilot).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_R2_BASE_URL: ${{ vars.PUBLIC_R2_BASE_URL }}

      - name: Ensure GitHub Pages skips Jekyll processing
        # GitHub Pages runs incoming static output through Jekyll by default,
        # which silently ignores any file/folder starting with an underscore
        # — exactly what Astro's hashed-asset output directory is called
        # (_astro/). Without this, the deployed site would be missing all
        # its CSS/JS with no obvious build error to explain why.
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
